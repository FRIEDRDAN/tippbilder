<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tippbilder</title>
<style>
  /* ===== Flipchart-Papier als Bühne ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #FCFBF7;
    background-image: radial-gradient(#E4E1D8 1.2px, transparent 1.2px);
    background-size: 34px 34px;
    font-family: "Segoe Print", "Comic Sans MS", "Chalkboard SE", cursive, sans-serif;
    user-select: none;
    cursor: default;
  }

  /* ===== Piktogramm-Sprites ===== */
  .sprite {
    position: absolute;
    filter: drop-shadow(4px 5px 0 #D6D2C7); /* bikablo-typischer grauer Schlagschatten */
    animation-duration: 5s;
    animation-timing-function: ease-out;
    animation-fill-mode: forwards;
    will-change: transform, opacity;
    pointer-events: none;
  }
  .layer {
    position: absolute; inset: 0;
    opacity: 0;
    transform: scale(0.55) rotate(7deg);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }
  .layer.show { opacity: 1; transform: scale(1) rotate(0deg); }
  .layer svg { display: block; width: 100%; height: 100%; }
  .layer img { width: 100%; height: 100%; object-fit: contain; }

  /* Vier Bewegungsvarianten */
  .v1 { animation-name: vUp; }
  .v2 { animation-name: vRight; }
  .v3 { animation-name: vLeft; }
  .v4 { animation-name: vWobble; }

  @keyframes vUp {
    0%   { transform: scale(0) rotate(var(--rot)); opacity: 0; }
    8%   { transform: scale(1.16) rotate(var(--rot)); opacity: 1; }
    13%  { transform: scale(1) rotate(var(--rot)); }
    72%  { transform: translateY(-18px) scale(1) rotate(var(--rot)); opacity: 1; }
    100% { transform: translateY(-64px) scale(1.03) rotate(var(--rot)); opacity: 0; }
  }
  @keyframes vRight {
    0%   { transform: scale(0) rotate(var(--rot)); opacity: 0; }
    8%   { transform: scale(1.16) rotate(var(--rot)); opacity: 1; }
    13%  { transform: scale(1) rotate(var(--rot)); }
    72%  { transform: translate(40px, -10px) scale(1) rotate(calc(var(--rot) + 6deg)); opacity: 1; }
    100% { transform: translate(85px, -30px) scale(1.02) rotate(calc(var(--rot) + 10deg)); opacity: 0; }
  }
  @keyframes vLeft {
    0%   { transform: scale(0) rotate(var(--rot)); opacity: 0; }
    8%   { transform: scale(1.16) rotate(var(--rot)); opacity: 1; }
    13%  { transform: scale(1) rotate(var(--rot)); }
    72%  { transform: translate(-40px, -10px) scale(1) rotate(calc(var(--rot) - 6deg)); opacity: 1; }
    100% { transform: translate(-85px, -30px) scale(1.02) rotate(calc(var(--rot) - 10deg)); opacity: 0; }
  }
  @keyframes vWobble {
    0%   { transform: scale(0) rotate(var(--rot)); opacity: 0; }
    8%   { transform: scale(1.16) rotate(var(--rot)); opacity: 1; }
    13%  { transform: scale(1) rotate(var(--rot)); }
    35%  { transform: scale(1.04) rotate(calc(var(--rot) - 8deg)); }
    58%  { transform: scale(1) rotate(calc(var(--rot) + 8deg)); }
    78%  { transform: scale(1.02) rotate(var(--rot)); opacity: 1; }
    100% { transform: scale(1.08) rotate(var(--rot)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .v1, .v2, .v3, .v4 { animation-name: fadeOnly; }
    .layer { transition: opacity 0.9s ease; transform: none; }
    .layer.show { transform: none; }
    @keyframes fadeOnly { 0% {opacity:0;} 10% {opacity:1;} 80% {opacity:1;} 100% {opacity:0;} }
  }

  /* ===== Start-Overlay ===== */
  #start {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; background: rgba(252, 251, 247, 0.96); text-align: center; padding: 24px;
  }
  #start h1 {
    font-size: clamp(2rem, 6vw, 3.4rem); color: #2B2B2B; letter-spacing: 0.02em;
    text-decoration: underline;
    text-decoration-color: #FFD43B;
    text-decoration-thickness: 10px;
    text-underline-offset: 8px;
  }
  #start p { color: #55524B; font-size: 1.05rem; max-width: 34rem; line-height: 1.5; }
  #startBtn {
    font-family: inherit; font-size: 1.3rem; padding: 14px 34px;
    background: #FFD43B; color: #2B2B2B; border: 3.5px solid #2B2B2B;
    border-radius: 14px; cursor: pointer;
    box-shadow: 4px 5px 0 #D6D2C7;
  }
  #startBtn:hover { transform: translate(-1px,-1px); box-shadow: 5px 6px 0 #D6D2C7; }
  #startBtn:focus-visible { outline: 3px dashed #2B2B2B; outline-offset: 4px; }
  #start small { color: #8A867D; }

  /* ===== Eltern-Knopf: Ton an/aus ===== */
  #soundBtn {
    position: fixed; top: 12px; right: 12px; z-index: 9;
    width: 46px; height: 46px; font-size: 1.3rem;
    background: #FCFBF7; border: 3px solid #2B2B2B; border-radius: 50%;
    box-shadow: 3px 3px 0 #D6D2C7; cursor: pointer; display: none;
  }
</style>
</head>
<body>

<div id="start">
  <h1>Tippbilder</h1>
  <p>Jede Taste lässt ein kleines Bild aufblühen – manche verwandeln sich in ein anderes.<br>
     Für Eltern: <strong>Esc</strong> beendet den Vollbildmodus jederzeit.
     Windows-Taste und Strg&nbsp;+&nbsp;W kann eine Webseite nicht abfangen.</p>
  <button id="startBtn">Los geht's – Vollbild starten</button>
  <small>Funktioniert komplett offline. Einfach Datei öffnen.</small>
</div>

<button id="soundBtn" title="Ton an/aus">🔊</button>

   2. Die Bilddateien in DENSELBEN Ordner wie diese HTML-Datei legen.
   3. Dateinamen unten eintragen, z. B.:
      const EIGENE_BILDER = ["katze.png", "haus.png", "oma.jpg"];
   Sie werden dann zusätzlich zu den eingebauten Piktogrammen gemischt.
   Sollen NUR eigene Bilder erscheinen: NUR_EIGENE = true setzen.

/* ===== Grundgerüst ===== */
const startOverlay = document.getElementById('start');
const startBtn = document.getElementById('startBtn');
const soundBtn = document.getElementById('soundBtn');

let audioCtx = null;
let soundOn = true;
let running = false;
let lastSpawn = 0;
const MAX_SPRITES = 45;
const MIN_INTERVAL_MS = 80;
const PENTATONIC = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33];
const VARIANTEN = ['v1', 'v2', 'v3', 'v4'];

function buildPool() {
  const own = EIGENE_BILDER.map(f => `<img src="${f}" alt="">`);
  if (NUR_EIGENE && own.length) return own;
  return own.concat(PIKTOS);
}
const POOL = buildPool();
const pick = () => POOL[Math.floor(Math.random() * POOL.length)];

function playTone() {
  if (!soundOn || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = PENTATONIC[Math.floor(Math.random() * PENTATONIC.length)];
  const t = audioCtx.currentTime;
  gain.gain.setValueAtTime(0.22, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.5);
}

function spawnSprite() {
  const now = performance.now();
  if (now - lastSpawn < MIN_INTERVAL_MS) return;
  lastSpawn = now;

  const el = document.createElement('div');
  el.className = 'sprite ' + VARIANTEN[Math.floor(Math.random() * VARIANTEN.length)];

  const size = 90 + Math.random() * 90;
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  el.style.left = Math.random() * (window.innerWidth - size) + 'px';
  el.style.top = Math.random() * (window.innerHeight - size - 60) + 'px';
  el.style.setProperty('--rot', (Math.random() * 16 - 8).toFixed(1) + 'deg');

  // Zwei Bildebenen: A erscheint sofort, B übernimmt beim Verwandeln
  const a = document.createElement('div');
  a.className = 'layer show';
  a.innerHTML = pick();
  const b = document.createElement('div');
  b.className = 'layer';
  let bBild = pick();
  while (POOL.length > 1 && bBild === a.innerHTML) bBild = pick();
  b.innerHTML = bBild;
  el.append(a, b);

  document.body.appendChild(el);

  // Verwandlung: A blendet aus, B blendet ein (Crossfade)
  if (Math.random() < MORPH_ANTEIL) {
    setTimeout(() => {
      if (!el.isConnected) return;
      a.classList.remove('show');
      b.classList.add('show');
    }, 1400 + Math.random() * 900);
  }

  el.addEventListener('animationend', () => el.remove());

  const sprites = document.querySelectorAll('.sprite');
  if (sprites.length > MAX_SPRITES) sprites[0].remove();

  playTone();
}

/* ===== Start ===== */
startBtn.addEventListener('click', async () => {
  try { await document.documentElement.requestFullscreen(); } catch (e) { /* Vollbild verweigert – läuft trotzdem */ }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  startOverlay.style.display = 'none';
  soundBtn.style.display = 'block';
  running = true;
});

soundBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
});

/* ===== Tasten abfangen ===== */
window.addEventListener('keydown', (e) => {
  if (!running) return;
  e.preventDefault(); // blockt F5, Tab, Leertaste-Scroll usw. – NICHT Windows-Taste, Strg+W, Esc im Vollbild
  spawnSprite();
});

/* Klick/Touch auf die Fläche erzeugt ebenfalls ein Bild (für Tablet/Maus) */
window.addEventListener('pointerdown', (e) => {
  if (!running || e.target === soundBtn) return;
  spawnSprite();
});

/* Kontextmenü unterdrücken */
window.addEventListener('contextmenu', (e) => { if (running) e.preventDefault(); });
</script>

</html>
